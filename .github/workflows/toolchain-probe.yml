name: Toolchain probe

on:
  push:
    branches: [ci/macos-toolchain-matrix]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchains available
        run: |
          ls -d /Applications/Xcode*.app || true
          sw_vers
      - name: Select newest Xcode (beta included)
        run: |
          X="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $X"
          sudo xcode-select -s "$X"
          swift --version
          xcrun --show-sdk-version
      - name: Build
        run: |
          set -o pipefail
          swift build -c release 2>&1 | grep -E "error:|warning:|note:|^/" | head -80
