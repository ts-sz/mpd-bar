name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and integration test
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: swift --version

      - name: Build app and probe
        run: |
          scripts/bundle.sh
          echo "PROBE=$PWD/build/mpdbar-probe" >> "$GITHUB_ENV"

      - name: Start a local MPD
        run: |
          brew install mpd
          D="$RUNNER_TEMP/mpd"
          mkdir -p "$D/music" "$D/playlists"
          printf '%s\n' \
            "https://stream.radioparadise.com/mellow-192" \
            "https://stream.radioparadise.com/mp3-128" > "$D/playlists/ci-radios.m3u"
          cat > "$D/mpd.conf" <<EOF
          music_directory    "$D/music"
          playlist_directory "$D/playlists"
          db_file            "$D/db"
          state_file         "$D/state"
          pid_file           "$D/pid"
          log_file           "$D/log"
          bind_to_address    "127.0.0.1"
          port               "6600"
          zeroconf_enabled   "no"
          audio_output {
            type       "null"
            name       "null"
            mixer_type "software"
          }
          EOF
          mpd "$D/mpd.conf"
          for i in $(seq 1 20); do nc -z 127.0.0.1 6600 && break; sleep 0.5; done

      - name: Probe MPD (read-only)
        run: |
          "$PROBE" --mpd 127.0.0.1:6600 --playlist ci-radios

      - name: Probe MPD (play, volume, stop)
        run: |
          "$PROBE" --mpd 127.0.0.1:6600 --playlist ci-radios --write

      - name: Probe error path (unknown playlist)
        run: |
          set +e
          out="$("$PROBE" --mpd 127.0.0.1:6600 --playlist nope 2>&1)"
          code=$?
          echo "$out"
          [ "$code" -eq 1 ] && echo "$out" | grep -q 'not found'

      - name: Release scripts
        run: |
          bash -n scripts/*.sh
          V="$(sed -n 's/.*static let string = "\(.*\)".*/\1/p' Sources/MPDBarCore/Models.swift)"
          scripts/check-version.sh "v$V"
          scripts/release-notes.sh "v$V" > "$RUNNER_TEMP/notes.md"
          grep -q 'brew install ts-sz/mpd-bar/mpd-bar' "$RUNNER_TEMP/notes.md"

      - name: Homebrew formula (HEAD)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          brew tap-new --no-git local/ci
          cp Formula/mpd-bar.rb "$(brew --repository)/Library/Taps/local/homebrew-ci/Formula/"
          brew install --HEAD local/ci/mpd-bar
          brew test local/ci/mpd-bar

      - name: MPD log
        if: failure()
        run: |
          cat "$RUNNER_TEMP/mpd/log" || true

  toolchains:
    name: Newest toolchain (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the newest installed Xcode
        run: |
          X="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $X"
          sudo xcode-select -s "$X"
          swift --version
          echo "SDK $(xcrun --show-sdk-version)"

      - name: Build, warnings as errors
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Build in Swift 6 language mode
        run: |
          swift package clean
          swift build -c release -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -warnings-as-errors
