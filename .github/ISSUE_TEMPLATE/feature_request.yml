name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed behaviour
  - type: dropdown
    id: backend
    attributes:
      label: Server concerned
      options:
        - Both
        - Mopidy
        - MPD
